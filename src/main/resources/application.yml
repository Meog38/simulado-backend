server:
  port: ${PORT:8080}

spring:
  application:
    name: avaliacoes-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/avaliacoes}
    username: ${DB_USERNAME:avaliacoes}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI}

app:
  security:
    auth0:
      audience: ${AUTH0_AUDIENCE}
      roles-claim: ${AUTH0_ROLES_CLAIM:https://simulado-backend.example.com/roles}
      email-claim: ${AUTH0_EMAIL_CLAIM:https://simulado-backend.example.com/email}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
