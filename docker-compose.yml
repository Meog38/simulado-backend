services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: avaliacoes
      POSTGRES_USER: avaliacoes
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avaliacoes -d avaliacoes"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
